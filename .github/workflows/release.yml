name: Release extension

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: suno-song-downloader.zip
    steps:
      - uses: actions/checkout@v5

      - name: Read manifest
        id: meta
        run: |
          version=$(jq -er '.version' manifest.json)
          name=$(jq -er '.name' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # Zips exactly the committed files, minus root dotfiles (.github, .gitignore, ...),
      # with manifest.json at the root of the archive.
      - name: Build zip
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/$ZIP_NAME" HEAD -- . ':!.*'
          unzip -l "dist/$ZIP_NAME"
          unzip -Z1 "dist/$ZIP_NAME" | grep -qx 'manifest.json'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Built from \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\`."
            echo
            git log -1 --format=%B
            echo
            echo "### Install"
            echo "1. Download **$ZIP_NAME** below and unzip it."
            echo "2. Open \`chrome://extensions\` and turn on **Developer mode**."
            echo "3. Click **Load unpacked** and pick the unzipped folder."
          } > "$notes"

          flags=()
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "dist/$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$notes" \
            "${flags[@]}"
